
#Graphics
[graphics]
	#Intensity of screenshake.
	#Range: 0.0 ~ 10.0
	screenshakeIntensity = 0.5
	#Enable weather render fix in fabulous graphics.
	fabulousWeatherFix = true
	#Enable fancy fog.
	fancyFog = false
	#Intensity of fancy fog.
	#Range: 0.0 ~ 100.0
	fancyFogntensity = 2.0
	#Enable sphere shape of fancy fog.
	fancyFogSphere = false
	#Enable dependence of clouds on day time.
	daylightClouds = true
	#Enable dependence of clouds on day time when daylight cycle disabled.
	daylightCloudsIgnore = false

	#Particles
	[graphics.particles]
		#Enable dropping items particles.
		itemParticle = true
		#Enable items particles in GUI.
		itemGuiParticle = true
		#Enable blood particles in case of damage.
		bloodParticle = false
		#Enable custom effect of lightning bolt.
		lightningBoltEffect = true
		#Enable custom effect of explosion.
		explosionEffect = false
		#Enable screenshake for custom effect of explosion.
		explosionEffectScreenshake = false
		#Enable light for custom effect of lightning bolt.
		lightningBoltEffectLight = true
		#Enable screenshake for custom effect of lightning bolt.
		lightningBoltEffectScreenshake = true

	#Shaders
	[graphics.shaders]
		#Enable a log warning about exceeding the post-process shader instance limit
		postProcessShaderInstanceLog = true

#Menu
[menu]
	#Enable Fluffy Fur menu button.
	menuButton = false
	#Fluffy Fur menu button row.
	#Range: 1 ~ 4
	menuButtonRow = 3
	#Fluffy Fur menu button X offset with row.
	menuButtonRowXOffset = 4
	#Fluffy Fur menu button X offset.
	menuButtonXOffset = 0
	#Fluffy Fur menu button Y offset.
	menuButtonYOffset = 0
	#Enable logo in Fluffy Fur Panorama.
	panoramaLogo = false
	#Enable music in Fluffy Fur Panorama.
	panoramaMusic = false
	#Enable enhanced menu.
	#Replaces dirt background with a transparent one with a panorama.
	enhancedMenu = true
	#Enable vanilla panorama conflict prevention.
	#When other mods change the vanilla panorama texture, it tries to intercept that texture for seamless transitions between screens.
	vanillaPanoramaConflictPrevention = true
	#Enable Fluffy Fur pause screen button.
	pauseScreenButton = true
	#Fluffy Fur pause screen button row.
	#Range: 1 ~ 6
	pauseScreenButtonRow = 4
	#Fluffy Fur pause screen button X offset with row.
	pauseScreenButtonRowXOffset = 4
	#Fluffy Fur pause screen button X offset.
	pauseScreenButtonXOffset = 0
	#Fluffy Fur pause screen button Y offset.
	pauseScreenButtonYOffset = 0
	#Enable custom pack selection button.
	packButton = true
	#Custom pack selection button X offset with row.
	packButtonRowXOffset = -4
	#Custom pack selection button X offset.
	packButtonXOffset = 0
	#Custom pack selection button Y offset.
	packButtonYOffset = 0

#Overlay
[overlay]

	#Rain Fog
	[overlay.rainFog]
		#Enable Rain Fog overlay effect.
		rainFogOverlay = true
		#Intensity of Rain Fog overlay effect.
		#Range: 0.0 ~ 2.0
		rainFogOverlayIntensity = 0.3
		#Intensity of Thunder Fog overlay effect.
		#Range: 0.0 ~ 2.0
		thunderFogOverlayIntensity = 0.1
		#Intensity of Thunder Fog fade overlay effect.
		#Range: 0.0 ~ 1.0
		thunderFogFadeOverlayIntensity = 0.25
		#Enable noise for Rain Fog overlay effect.
		rainFogOverlayNoise = true
		#Enable Interleaved Gradient Noise for Rain Fog overlay effect.
		rainFogOverlayIGN = true

